app = "hgjaustin-nightscout"

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  checks = [{ grace_period = '5s', interval = '15s', method = 'GET', path = '/health', timeout = '2s' }]

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
